<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main class="container main" id="main">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Sign in</h1>
        <p>Welcome back. Please sign in to your account.</p>
      </div>

      <form id="login-form" class="auth-form">
        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="field">
          <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
          <input id="email" placeholder="Enter your email" name="email" type="email" class="control" required autocomplete="email" aria-describedby="email-error" />
          <p id="email-error" class="field-error" data-error-for="email" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
          <input id="password" placeholder="Enter your password" name="password" type="password" class="control" required minlength="6" aria-describedby="password-error" />
          <p id="password-error" class="field-error" data-error-for="password" hidden></p>
        </div>

        <div class="field-col">
          <button type="submit" id="login-btn" class="btn btn-primary">Sign in</button>
          <a href="./register.html" id="go-register" class="btn btn-ghost">Need an account? Sign up</a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="./js/auth.js?v=2"></script>
  <script type="module" src="./js/login.js?v=2"></script>
</body>
</html>
